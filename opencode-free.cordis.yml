# harness-tui: unattended coding agent over the FREE OpenCode Zen (the `opencode`
# provider, endpoint https://opencode.ai/zen/v1) route — `*-free` models have
# cost 0. stdout stays reserved for JSON-RPC. Credentials resolve per request
# through the injected OPENCODE_GO_API_KEY (dsh-credentials-local); the same
# OpenCode key authenticates both the free Zen and Go gateways.

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# User-settings document provider. dsh-llm-pi-ai installs its provider section
# through the `settings` service (installSettingsSection); without a settings
# provider mounted, that section never activates and OPENCODE (or any) provider
# route stays unregistered. The Web composition mounts this.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# NOTE: no separate `llm` entry here — @deepseek-ai/dsh-agent-spine-demo mounts
# LlmRuntime itself. Adding `llm` again produced a duplicate that left pi-ai's
# `opencode` adapter unregistered in this composition.

# pi-ai multi-provider adapter; only the free OpenCode Zen (`opencode`) route is
# enabled. `*-free` models cost 0.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      opencode:
        apiKeyEnv: OPENCODE_GO_API_KEY

# The agent-default model used by SDK-created agents (a free OpenCode Zen model).
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: opencode
    model: deepseek-v4-flash-free

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a helpful coding assistant.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions-opencode-free'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
